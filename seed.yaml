# Household Registry — Seed Data
#
# Authoritative source for the multi-pool-repo-example demo.
# Run `python seed.py` to recreate the registry and all nodes from scratch.
# Blow away the registry/ directory first if you want a clean slate.
#
# Schema: mirrors alph node frontmatter; timestamp drives node ordering.
# All nodes are snapshot type unless node_type is explicitly "live".

registry:
  id: household
  context: >-
    Household asset registry tracking maintenance history, decisions, and
    status across vehicles, appliances, and remodeling projects.
  name: Household

pools:
  vehicles:
    context: >-
      Vehicles owned by the household — maintenance logs, repair decisions,
      purchase and sale records, and insurance/registration notes.
    pool_type: subdir

  appliances:
    context: >-
      Major household appliances — purchase dates, warranty info,
      repair history, and replacement decisions.
    pool_type: subdir

  remodeling:
    context: >-
      Home improvement and remodeling projects — planning notes, contractor
      decisions, work completed, and open punch lists.
    pool_type: subdir

nodes:
  vehicles:
    - timestamp: "2021-03-15T09:00:00+00:00"
      source: cli
      node_type: snapshot
      creator: homeowner@example.com
      context: >-
        Purchased 2018 Honda CR-V EX-L with 41,200 miles from CarMax for $24,800.
        VIN 2HKRW2H87JH123456. Color: Lunar Silver Metallic.
      tags: [purchase, crv, honda]

    - timestamp: "2021-06-01T10:30:00+00:00"
      source: cli
      node_type: snapshot
      creator: homeowner@example.com
      context: >-
        CR-V 5,000-mile oil change (46,200 miles). Synthetic 0W-20. Jiffy Lube
        on Main St. Also rotated tires — front left had 3mm less tread than
        others, flagged for monitoring.
      tags: [maintenance, crv, oil-change]

    - timestamp: "2021-09-10T14:00:00+00:00"
      source: cli
      node_type: snapshot
      creator: homeowner@example.com
      context: >-
        CR-V rear brake pads replaced at Honda dealership (50,100 miles).
        $340 parts and labor. Tech noted front brakes still have ~40% left.
      tags: [repair, crv, brakes]

    - timestamp: "2022-02-14T08:00:00+00:00"
      source: cli
      node_type: snapshot
      creator: homeowner@example.com
      context: >-
        Purchased 2020 Toyota RAV4 Hybrid XSE AWD, new, $38,400 after negotiation.
        VIN JTMEWRFV3LD123789. Color: Supersonic Red. Replaced the aging 2012 Civic
        that was sold privately for $6,200.
      tags: [purchase, rav4, toyota, hybrid]

    - timestamp: "2022-08-03T11:00:00+00:00"
